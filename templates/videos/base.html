<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Video Hub{% endblock %}</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0e12;--surface:#161821;--surface-2:#1e212c;--line:#2a2e3d;--text:#eceef4;--muted:#979db0;--accent:#e5484d;--accent-hover:#f0646a}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(13,14,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
  .brand-mark svg{width:16px;height:16px;fill:#fff;margin-left:2px}
  .search{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:.6rem 1rem;width:100%;font-size:.92rem}
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--accent);box-shadow:none;background:var(--surface);color:var(--text)}
  .thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:12px}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 55%);opacity:0;transition:opacity .2s}
  .thumb .play span{width:50px;height:50px;border-radius:50%;background:rgba(229,72,77,.94);display:grid;place-items:center}
  .thumb .play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
  a:hover .thumb .play,a:focus-visible .thumb .play{opacity:1}
  .v-title{font-size:.94rem;font-weight:650;line-height:1.4;margin:.7rem 0 .2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .v-meta{color:var(--muted);font-size:.8rem}
  .chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:thin}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:.4rem .95rem;font-size:.85rem;font-weight:600}
  .chip:hover{color:var(--text);border-color:#444a60}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:3.5rem 1.5rem;text-align:center;max-width:560px;margin:2rem auto}
  .empty h3{font-size:1.15rem;font-weight:700}.empty p{color:var(--muted);margin:0}
  .pager a,.pager span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.5rem 1rem;font-weight:600;font-size:.9rem}
  .pager a:hover{border-color:var(--accent)}
  footer{border-top:1px solid var(--line);margin-top:4rem;padding:1.75rem 0;color:var(--muted);font-size:.85rem}
  .gate{position:fixed;inset:0;z-index:100;background:rgba(8,9,12,.97);display:none;align-items:center;justify-content:center;padding:1.5rem}
  .gate.show{display:flex}
  .gate-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2rem;max-width:420px;width:100%;text-align:center}
  .gate-box h2{font-weight:800;font-size:1.4rem}.gate-box p{color:var(--muted);font-size:.92rem;margin:.6rem 0 1.5rem}
  .btn-accent{background:var(--accent);border:0;color:#fff;font-weight:700;border-radius:10px;padding:.7rem 1.2rem}
  .btn-accent:hover{background:var(--accent-hover);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;border-radius:10px;padding:.7rem 1.2rem}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  {% block extra_css %}{% endblock %}
</style>
</head>
<body>
{% if age_gate %}
<div class="gate" id="ageGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-box">
    <h2 id="gateTitle">Age verification</h2>
    <p>This site contains content intended for adults. You must be 18 or older to continue.</p>
    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-accent" id="gateYes">I am 18 or older</button>
      <a class="btn btn-ghost" href="https://www.google.com">Leave</a>
    </div>
  </div>
</div>
<script>
(function(){var g=document.getElementById('ageGate'),ok=false;
try{ok=localStorage.getItem('age_ok')==='1'}catch(e){}
if(!ok)g.classList.add('show');
document.getElementById('gateYes').addEventListener('click',function(){
try{localStorage.setItem('age_ok','1')}catch(e){}g.classList.remove('show')})})();
</script>
{% endif %}

<header class="topbar py-3">
  <div class="container d-flex align-items-center gap-3 flex-wrap">
    <a href="{% url 'videos:index' %}" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></span>
      Video Hub
    </a>
    <form class="ms-auto" method="get" action="{% url 'videos:index' %}" style="flex:1 1 280px;max-width:440px" role="search">
      <input type="search" name="q" value="{{ q|default:'' }}" class="form-control search" placeholder="Search videos" aria-label="Search videos">
    </form>
  </div>
</header>

<main class="container">{% block content %}{% endblock %}</main>

<footer>
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>&copy; Video Hub</span>
    <span>All content is uploaded by its rights holders with verified consent.</span>
  </div>
</footer>
</body>
