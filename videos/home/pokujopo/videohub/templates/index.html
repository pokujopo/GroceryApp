<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hub Portal</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .video-card { border: none; border-radius: 10px; overflow: hidden; transition: transform 0.2s; }
        .video-card:hover { transform: translateY(-5px); }
        .video-title { font-size: 14px; font-weight: bold; height: 42px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-transform: capitalize; }
    </style>
</head>
<body class="bg-dark text-light py-5">
    <div class="container">
        <h2 class="text-center text-warning mb-5">📺 Automated Video Portal</h2>
        
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            {% for video in videos %}
                <div class="col">
                    <div class="card h-100 bg-secondary text-light video-card shadow">
                        <video width="100%" controls preload="none" style="background: #000;">
                            <source src="{{ video.url }}" type="video/mp4">
                        </video>
                        <div class="card-body p-2">
                            <p class="card-text video-title" title="{{ video.title }}">{{ video.title }}</p>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center text-muted">
                    <p>Bado hakuna video kwenye database. Tafadhali subiri worker akague sitemap au washa task sasa hivi.</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
